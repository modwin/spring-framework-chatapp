spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/chat_application}
    username: ${DATABASE_USERNAME:chat_app}
    password: ${DATABASE_PASSWORD:chat_app}
  application:
    name: ModwinChatApp
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
