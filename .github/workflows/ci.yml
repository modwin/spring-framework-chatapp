name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests and PostgreSQL integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  container-smoke:
    name: Container build and smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-local-only
      SPRING_PROFILES_ACTIVE: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start Compose stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Verify local-only authentication provider
        run: curl --fail --silent http://localhost:3000/api/auth/providers | jq --exit-status '.providers == ["LOCAL"]'

      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
